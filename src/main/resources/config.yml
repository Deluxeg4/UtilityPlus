# UtilityPlus Configuration

# Spawn Settings
# -----------------------------------------------
spawn:
  # Teleport player to spawn on their very first join
  tp-spawn-first-join: false
  # Teleport player to spawn after they click the Respawn button
  tp-spawn-on-death: false
  # Teleport to spawn on respawn ONLY if they have no bed/respawn anchor
  tp-spawn-no-respawn-point: false
  # Cooldown (seconds) between /spawn uses. 0 = disabled. OP bypasses.
  tp-spawn-cooldown: 30
  # Warmup (seconds) before teleporting — player must stand still. 0 = instant.
  tp-spawn-warmup: 5
# -----------------------------------------------
# Random Respawn Settings
# (When enabled, players respawn at a random location on death)
# Completely independent from the /setspawn system above.
# -----------------------------------------------
random-respawn:
  enabled: true
  min-radius: 0
  max-radius: 300
  # How many locations to try before falling back to spawn
  attempts: 48
  # The world name where random respawn should happen (default to world)
  world: "world"

# List of blocks that are considered unsafe to spawn on or next to
unsafe-blocks:
  - LAVA
  - WATER
  - CACTUS
  - FIRE
  - MAGMA_BLOCK
  - SWEET_BERRY_BUSH
  - POWDER_SNOW

# -----------------------------------------------
# Custom Join/Leave Message Settings
# -----------------------------------------------
# Placeholders: {player} = player name, {displayname} = display name,
# {world} = world name, {online} = online players count, {max} = max players
# Use & for color codes (e.g., &a = green, &c = red, &l = bold, &e = yellow)

join-message:
  enabled: false
  # Hide the default Minecraft join message
  hide-vanilla: true
  # Broadcast to all players
  broadcast: true
  # Message shown to everyone when player joins
  message: "&3{player} joined the game"

leave-message:
  enabled: false
  # Hide the default Minecraft leave message
  hide-vanilla: true
  # Broadcast to all players
  broadcast: true
  # Message shown when player leaves
  message: "&e{player} left the game"

# -----------------------------------------------
# Bedrock / Floodgate Join Warning
# -----------------------------------------------
# This is sent only to players identified by Floodgate, on every login.
# Floodgate remains optional; no warning is sent if it is not installed.
bedrock-warning:
  enabled: true
  message:
    - "&62b2t-th is best played on Java Edition. The Bedrock Edition"
    - "&6experience may not be optimal - 2b2t-th.org/bedrock"

# Enables Bedrock native upper-left coordinate display for Floodgate players.
# Geyser must be installed on this server. If Geyser runs on a proxy, set
# show-coordinates: true in the proxy Geyser config instead.
bedrock-coordinates:
  enabled: true
  # Placeholders: {x}, {y}, {z}
  format: "&6Pos: ({x}, {y}, {z})"

# -----------------------------------------------
# Custom Death Message Settings
# -----------------------------------------------
# Placeholders: {message} = original Minecraft death message,
# {player} = dead player name, {killer} = killer name (if any)
# Use & for color codes.

death-message:
  enabled: true
  # Keep the original Minecraft death message text, but recolor it below.
  message: "{message}"
  # Main message color
  message-color: "&4"
  # Player/killer name color
  name-color: "&3"

# -----------------------------------------------
# Tab List Header/Footer Settings
# -----------------------------------------------
# Placeholders: %server_tps_1_colored%, %server_online%,
# %player_ping%, %server_uptime%

tab-list:
  enabled: true
  # How often to refresh dynamic placeholders, in seconds
  update-interval: 1
  header:
    # - ""
    - "&7&l2BUILDERS&7&l2TOOLS"
    #- "&6&oThailand"
    - "&4&oT&f&oh&1&oa&f&oi&4&ol&4&oa&4&ond"
    - ""
    - "&6Server updated to 26.3"
    - ""
  footer:
    # - ""
    #- "  %server_tps_1_colored% &3tps - %server_online% players online - %player_ping% ping - &3%server_uptime% uptime "
    - "  &8%server_tps%&8 tps — %server_online% players online — %player_ping% ping "
    - ""
    #- "&7&odiscord: dsc.gg/2b2t-th"
    #- "&8&owebsite: 2b2t-th.org"
    #- ""

# -----------------------------------------------
# Broadcast Settings
# -----------------------------------------------
broadcast:
  # Prefix shown before broadcast messages
  prefix: "&6&l[Alert]&r "

# -----------------------------------------------
# Announcement Settings
# -----------------------------------------------
announcement:
  action-bar:
    enabled: true
    # Duration to stay visible (seconds)
    show-duration: 15
    # Duration to stay hidden (seconds, 300 = 5 minutes)
    hide-duration: 300
    # The text to show in the Action Bar
    text:
      - "&62b2t-th.org"
      - "&6dsc.gg/2b2t-th"

# -----------------------------------------------
# Command and chat messages
# Placeholders: {player}, {page}, {pages}
# -----------------------------------------------
messages:
  bad-command: "&4Bad command. Type /help for all commands."
  player-not-online: "&6This player is not online."
  ignore:
    self: "&6You can not ignore yourself."
    normal-enabled: "&6Now ignoring &3{player}"
    normal-disabled: "&6No longer ignoring &3{player}."
    hard-enabled: "&6Permanently ignoring {player}. This is saved in &4/ignorelist."
    hard-disabled: "&6No longer permanently ignoring &3{player}"
    death-enabled: "&6You will no longer see this players death messages."
    death-disabled: "&6You will now see this players death messages."
  ignore-list:
    empty: "&6No players ignored."
    invalid-page-singular: "&cInvalid page argument, there are only {pages} page."
    invalid-page-plural: "&cInvalid page argument, there are only {pages} pages."
    title: "&6[ Ignored players &7"
    previous-active: "&b[<]"
    previous-inactive: "&7[<]"
    previous-hover: "&6Click to go to the previous page"
    page-counter: " &6{page}/{pages} "
    next-active: "&b[>]"
    next-inactive: "&7[>]"
    next-hover: "&6Click to go to the next page"
    suffix: " &6]"
    player-row-prefix: "&3{player} &7["
    hard-label: "&6hard"
    soft-label: "&6soft"
    player-row-suffix: "&7]"
    hard-hover: "&6Click to remove the permanent ignore"
    soft-hover: "&6Click to remove the soft ignore"
  player-name:
    hover: "&6Message &3{player}"
    suggest-command: "/w {player}"

# -----------------------------------------------
