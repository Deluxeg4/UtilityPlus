# UtilityPlus Configuration

# Spawn Settings
# -----------------------------------------------
spawn:
  # Teleport player to spawn on their very first join
  tp-spawn-first-join: false
  # Teleport player to spawn after they click the Respawn button
  tp-spawn-on-death: false
  # Teleport to spawn on respawn ONLY if they have no bed/respawn anchor
  tp-spawn-no-respawn-point: false
  # Cooldown (seconds) between /spawn uses. 0 = disabled. OP bypasses.
  tp-spawn-cooldown: 30
  # Warmup (seconds) before teleporting — player must stand still. 0 = instant.
  tp-spawn-warmup: 5
# -----------------------------------------------
# Random Respawn Settings
# (When enabled, players respawn at a random location on death)
# Completely independent from the /setspawn system above.
# -----------------------------------------------
random-respawn:
  enabled: true
  min-radius: 0
  max-radius: 300
  # How many locations to try before falling back to spawn
  attempts: 48
  # The world name where random respawn should happen (default to world)
  world: "world"

# List of blocks that are considered unsafe to spawn on or next to
unsafe-blocks:
  - LAVA
  - WATER
  - CACTUS
  - FIRE
  - MAGMA_BLOCK
  - SWEET_BERRY_BUSH
  - POWDER_SNOW

# -----------------------------------------------
# Custom Join/Leave Message Settings
# -----------------------------------------------
# Placeholders: {player} = player name, {displayname} = display name,
# {world} = world name, {online} = online players count, {max} = max players
# Use MiniMessage tags for formatting, e.g. <green>, <red>, <bold>, <yellow>.

join-message:
  enabled: false
  # Hide the default Minecraft join message
  hide-vanilla: true
  # Broadcast to all players
  broadcast: true
  # Message shown to everyone when player joins
  message: "<dark_aqua>{player} joined the game"

leave-message:
  enabled: false
  # Hide the default Minecraft leave message
  hide-vanilla: true
  # Broadcast to all players
  broadcast: true
  # Message shown when player leaves
  message: "<yellow>{player} left the game"

# -----------------------------------------------
# Bedrock / Floodgate Join Warning
# -----------------------------------------------
# This is sent only to players identified by Floodgate, on every login.
# Floodgate remains optional; no warning is sent if it is not installed.
bedrock-warning:
  enabled: true
  message:
    - "<gold>2b2t-th is best played on Java Edition. The Bedrock Edition"
    - "<gold>experience may not be optimal - 2b2t-th.org/bedrock"

# Enables Bedrock native upper-left coordinate display for Floodgate players.
# Geyser must be installed on this server. If Geyser runs on a proxy, set
# show-coordinates: true in the proxy Geyser config instead.
bedrock-coordinates:
  enabled: true
  # Placeholders: {x}, {y}, {z}
  format: "<gold>Pos: ({x}, {y}, {z})"

# -----------------------------------------------
# Custom Death Message Settings
# -----------------------------------------------
# Placeholders: {message} = original Minecraft death message,
# {player} = dead player name, {killer} = killer name (if any)
# Use MiniMessage tags for color and formatting.

death-message:
  enabled: true
  # Keep the original Minecraft death message text, but recolor it below.
  message: "{message}"
  # Main message color
  message-color: "<dark_red>"
  # Player/killer name color
  name-color: "<dark_aqua>"

# -----------------------------------------------
# Tab List Header/Footer Settings
# -----------------------------------------------
# Placeholders: %server_tps_1_colored%, %server_online%,
# %player_ping%, %server_uptime%

tab-list:
  enabled: true
  # How often to refresh dynamic placeholders, in seconds
  update-interval: 1
  header:
    # - ""
    - "<gray><bold>2BUILDERS<gray><bold>2TOOLS"
    #- "<gold><italic>Thailand"
    - "<dark_red><italic>T<white><italic>h<dark_blue><italic>a<white><italic>i<dark_red><italic>l<dark_red><italic>a<dark_red><italic>nd"
    - ""
    - "<gold>Server updated to 26.3"
    - ""
  footer:
    # - ""
    #- "  %server_tps_1_colored% <dark_aqua>tps - %server_online% players online - %player_ping% ping - <dark_aqua>%server_uptime% uptime "
    - "  <dark_gray>%server_tps%<dark_gray> tps — %server_online% players online — %player_ping% ping "
    - ""
    #- "<gray><italic>discord: dsc.gg/2b2t-th"
    #- "<dark_gray><italic>website: 2b2t-th.org"
    #- ""

# -----------------------------------------------
# Broadcast Settings
# -----------------------------------------------
broadcast:
  # Prefix shown before broadcast messages
  prefix: "<gold><bold>[Alert]<reset> "

# -----------------------------------------------
# Announcement Settings
# -----------------------------------------------
announcement:
  action-bar:
    enabled: true
    # Duration to stay visible (seconds)
    show-duration: 15
    # Duration to stay hidden (seconds, 300 = 5 minutes)
    hide-duration: 300
    # The text to show in the Action Bar
    text:
      - "<gold>2b2t-th.org"
      - "<gold>dsc.gg/2b2t-th"

# -----------------------------------------------
# Command and chat messages
# Placeholders: {player}, {page}, {pages}
# -----------------------------------------------
messages:
  bad-command: "<dark_red>Bad command. Type /help for all commands."
  player-not-online: "<gold>This player is not online."
  ignore:
    self: "<gold>You can not ignore yourself."
    normal-enabled: "<gold>Now ignoring <dark_aqua>{player}"
    normal-disabled: "<gold>No longer ignoring <dark_aqua>{player}."
    hard-enabled: "<gold>Permanently ignoring {player}. This is saved in <dark_red>/ignorelist."
    hard-disabled: "<gold>No longer permanently ignoring <dark_aqua>{player}"
    death-enabled: "<gold>You will no longer see this players death messages."
    death-disabled: "<gold>You will now see this players death messages."
  ignore-list:
    empty: "<gold>No players ignored."
    invalid-page-singular: "<red>Invalid page argument, there are only {pages} page."
    invalid-page-plural: "<red>Invalid page argument, there are only {pages} pages."
    title: "<gold>[ Ignored players <gray>"
    previous-active: "<aqua>[<]"
    previous-inactive: "<gray>[<]"
    previous-hover: "<gold>Click to go to the previous page"
    page-counter: " <gold>{page}/{pages} "
    next-active: "<aqua>[>]"
    next-inactive: "<gray>[>]"
    next-hover: "<gold>Click to go to the next page"
    suffix: " <gold>]"
    player-row-prefix: "<dark_aqua>{player} <gray>["
    hard-label: "<gold>hard"
    soft-label: "<gold>soft"
    player-row-suffix: "<gray>]"
    hard-hover: "<gold>Click to remove the permanent ignore"
    soft-hover: "<gold>Click to remove the soft ignore"
  player-name:
    hover: "<gold>Message <dark_aqua>{player}"
    suggest-command: "/w {player}"

# -----------------------------------------------
