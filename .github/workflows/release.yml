name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Read release version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release JAR
        run: ./gradlew build --no-daemon -Pversion="$RELEASE_VERSION"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: UtilityPlus ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: build/libs/UtilityPlus-${{ env.RELEASE_VERSION }}.jar
          draft: false
          prerelease: false
